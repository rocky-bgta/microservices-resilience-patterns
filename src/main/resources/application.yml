spring:
  application:
    name: resilience-patterns
resilience4j:
  circuitbreaker:
    instances:
      downstream:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
